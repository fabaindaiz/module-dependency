[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
  "src/dependency"
]

[tool.hatch.build.targets.wheel.force-include]
"stubs/dependency" = "dependency-stubs"

[tool.hatch.envs.build]
template = "default"
skip-install = false
dependencies = [
  "graphviz",
  "mypy",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "uvloop",
]

[tool.hatch.envs.build.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.build.scripts]
audit = "python tools/audit_dependency.py"
coverage = "pytest --cov src/dependency --cov-report html -n auto --dist=loadfile"
# `docs` shells out because mkdocs lives in its own env; the docs build used to run only
# when a release was published, and it was broken for a long time before anyone found out.
docs = "hatch run docs:build"
gate = ["tests", "typecheck", "lint", "format", "audit", "docs"]
# --check writes nothing. Never the bare `ruff format` from the gate: this repo's
# own rule is that a formatter does not run on a tree it might be sharing.
format = "ruff format --check src tests tools"
graph = "python src/graph.py"
# Writes nothing. A fixer must never be run by the gate: `ruff check --fix` once deleted
# every line of all six `imports.py` files, which is how implementations enter a build.
lint = "ruff check src tests tools"
example = "python src/main.py"
stubs = "stubgen src/dependency -o stubs --include-docstrings"
# The json report is what `audit_dependency.py::check_coverage_floors` reads. Without it
# the floors are unenforceable and the audit says so rather than passing quietly.
tests = "pytest -n auto --dist=loadfile --cov src/dependency --cov-report=json:.coverage.json"
typecheck = "mypy --strict src/dependency"

# The gate on the MINIMUM supported Python. The default build env uses whatever the
# developer has, which is newer, and that is the blind spot D-017 was found in: unquoted
# forward references work on 3.14 and raise NameError on 3.12 and 3.13. Green here is what
# CI means by green.
[tool.hatch.envs.floor]
template = "build"
python = "3.12"

[tool.hatch.envs.ceiling]
template = "build"
python = "3.13"

[tool.hatch.envs.docs]
skip-install = true
dependencies = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
]

[tool.hatch.envs.docs.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.docs.scripts]
build = "mkdocs build"
serve = "mkdocs serve"

[tool.ruff]
# stubs/ is generated (D-015) and site/build/dist are output.
extend-exclude = ["stubs", "site", "build", "dist"]

[tool.ruff.lint]
# D-025 declined the *formatter* and said nothing about the linter. This set is the part
# that finds defects rather than restyling: pyflakes, the error subset of pycodestyle,
# flake8-bugbear and blind-except. `I` and `UP` are deliberately absent -- they would
# rewrite imports and annotations across the tree, and every annotation change regenerates
# the stubs, which are the only type surface a consumer sees (D-015).
select = ["E4", "E7", "E9", "F", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
# An `imports.py` exists to import modules for their registration side effect. That is the
# documented mechanism by which an implementation enters a build (D-008), and F401 reads
# every line of one as an unused import. Measured: `ruff check --fix` deleted every line of
# all six of them in a single command, the comment explaining why they were there survived,
# and the example application stopped resolving with "Provider Clock has no implementation".
"**/imports.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project]
name = "module_dependency"
version = "2.0.0"
dependencies = [
  "dependency_injector>=4.48.2,<5",
  "jinja2",
  "pydantic",
  "pydantic-settings",
]
requires-python = ">=3.12"
authors = [
  { name="Fabian D", email="github.clapping767@passmail.net" },
]
description = "A dependency management tool for Python projects."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

keywords = [
  "dependency-injection",
  "dependency-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
graph = ["graphviz"]
testing = ["pytest>=8.0"]

[project.scripts]
dependency = "dependency.cli.main:main"

[project.entry-points.pytest11]
dependency = "dependency.testing.plugin"

[project.urls]
Homepage = "https://github.com/fabaindaiz/module-injection"
Documentation = "https://github.com/fabaindaiz/module-dependency/tree/main/docs"
Changelog = "https://github.com/fabaindaiz/module-dependency/blob/main/CHANGELOG.md"
Issues = "https://github.com/fabaindaiz/module-injection/issues"
